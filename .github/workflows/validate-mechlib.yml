name: Validate MechLib package

# Runs validate_mechlib_package.py automatically so regressions like the
# chi1 bin-size mismatch or the truthy-zero fallback bug can't silently
# creep back in without CI catching them.
#
# Paths below assume this file lives at the REPO ROOT under
# .github/workflows/ -- i.e. protein-backbone-mechanics/ IS the repo
# root (matches the GitHub URL cited in the paper's Data Availability
# statement: github.com/wei09128/protein-backbone-mechanics), not a
# subfolder of some larger repo. Do NOT prefix paths below with
# 'protein-backbone-mechanics/' -- actions/checkout already lands you
# inside the repo root, so that prefix double-counts the directory.

on:
  push:
    paths:
      - 'library/**'
      - '.github/workflows/validate-mechlib.yml'
  pull_request:
    paths:
      - 'library/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run validation suite
        run: python validate_mechlib_package.py
